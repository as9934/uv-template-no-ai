name: Setup Template

permissions:
  contents: write
  actions: write

on:
  push:
    branches: [main]

jobs:
  setup:
    runs-on: ubuntu-latest
    if: github.repository != 'as9934/uv-template-no-ai'

    steps:
      - uses: actions/checkout@v5

      - name: Update project name
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          sed -i "s/^name = \"uv-template\"/name = \"$REPO_NAME\"/" pyproject.toml

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet pyproject.toml; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Install uv
        if: steps.changes.outputs.changed == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.15"
          enable-cache: false

      - name: Update lockfile for the project name
        if: steps.changes.outputs.changed == 'true'
        run: uv lock

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "Initialize project name to ${{ github.event.repository.name }}"
          git push

      - name: Disable workflow
        if: steps.changes.outputs.changed == 'true'
        run: |
          gh workflow disable "Setup Template"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
